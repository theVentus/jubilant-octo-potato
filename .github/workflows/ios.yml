name: iOS
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios
  cancel-in-progress: true
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version | tee -a ci.log

      - name: Generate project
        run: brew install xcodegen ffmpeg && cd ios && xcodegen generate 2>&1 | tee -a ../ci.log

      - name: Pick simulator
        run: echo "UDID=$(python3 ios/scripts/pick-sim.py 2>>ci.log)" >> "$GITHUB_ENV"

      - name: Unit tests
        run: cd ios && xcodebuild test -project FX.xcodeproj -scheme FX -destination "id=$UDID" -quiet 2>&1 | tee -a ../ci.log

      - name: Screenshots
        timeout-minutes: 12
        run: bash ios/scripts/screenshots.sh 2>&1 | tee -a ci.log

      - name: Publish screenshots to ci-shots branch
        run: |
          cd shots
          git init -q -b ci-shots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots

      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild -project FX.xcodeproj -scheme FX -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS -derivedDataPath build/device \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build -quiet 2>&1 | tee -a ../ci.log
          mkdir -p Payload && cp -R build/device/Build/Products/Release-iphoneos/FX.app Payload/
          zip -qr FX.ipa Payload
          python3 scripts/altstore-source.py FX.ipa 1.0.${{ github.run_number }} ${{ github.run_number }} altstore.json

      - name: Publish IPA to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh release view latest -R $R >/dev/null 2>&1 || \
            gh release create latest -R $R --prerelease --title "Latest build" --notes "Unsigned IPA. Install with Sideloadly."
          gh release upload latest ios/FX.ipa ios/altstore.json -R $R --clobber
          gh release edit latest -R $R --notes "Unsigned IPA from ${GITHUB_SHA::7}. Install with Sideloadly."

      # Raw logs aren't reachable from the dev sandbox; surface failures as annotations instead.
      - name: Report failure
        if: failure()
        run: |
          touch ci.log
          grep -E "error:|failed|Error|Traceback|no iOS 26" ci.log | sort -u | head -9 | while IFS= read -r l; do echo "::error::${l:0:900}"; done
          tail -40 ci.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::warning title=tail::/'; echo
