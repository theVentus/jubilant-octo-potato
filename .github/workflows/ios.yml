name: iOS
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Generate project
        run: brew install xcodegen && cd ios && xcodegen generate

      - name: Pick simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = sorted((rt, x) for rt, xs in d.items() if "iOS-26" in rt for x in xs if x["name"].startswith("iPhone"))
          pick = [x for _, x in c if x["name"] == "iPhone 17 Pro Max"] or [x for _, x in c if "Pro Max" in x["name"]] or [x for _, x in c]
          print(pick[-1]["udid"]); print(pick[-1]["name"], file=sys.stderr)')
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Unit tests
        run: cd ios && xcodebuild test -project FX.xcodeproj -scheme FX -destination "id=$UDID" -quiet

      - name: Screenshots
        run: bash ios/scripts/screenshots.sh

      - name: Publish screenshots to ci-shots branch
        run: |
          cd shots
          git init -q -b ci-shots
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots

      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild -project FX.xcodeproj -scheme FX -configuration Release -sdk iphoneos \
            -destination generic/platform=iOS -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build -quiet
          mkdir -p Payload && cp -R build/device/Build/Products/Release-iphoneos/FX.app Payload/
          zip -qr FX.ipa Payload

      - name: Publish IPA to release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}
          gh release view latest -R $R >/dev/null 2>&1 || \
            gh release create latest -R $R --prerelease --title "Latest build" --notes "Unsigned IPA. Install with Sideloadly."
          gh release upload latest ios/FX.ipa -R $R --clobber
          gh release edit latest -R $R --notes "Unsigned IPA from ${GITHUB_SHA::7}. Install with Sideloadly."
