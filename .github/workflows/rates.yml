name: Refresh rates
on:
  schedule:
    - cron: '17 1 * * *'   # daily, 06:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch-rates.mjs]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch-rates.mjs
      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "rates: $(date -u +%F)" && git push)
